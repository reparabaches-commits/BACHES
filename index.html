<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Reporta tu Bache</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #0f0f0f;
      color: #fff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      padding: 10px 16px;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    .logo-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #e63946;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      color: #fff;
      flex-shrink: 0;
    }

    #header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      color: #fff;
      line-height: 1;
    }

    #header p {
      font-size: 11px;
      color: #888;
      line-height: 1;
      margin-top: 2px;
    }

    #counter-badge {
      margin-left: auto;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      color: #e63946;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .dot-red {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e63946;
      animation: pulso 1.5s infinite;
    }

    @keyframes pulso {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #map { flex: 1; width: 100%; z-index: 1; }

    #bottom-bar {
      background: #0f0f0f;
      border-top: 1px solid #222;
      padding: 12px 16px;
      flex-shrink: 0;
    }

    #btn-gps {
      width: 100%;
      padding: 14px;
      background: #e63946;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    #btn-gps:active { transform: scale(0.97); }
    #btn-gps:disabled { background: #444; cursor: not-allowed; }

    #status-msg {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      min-height: 16px;
    }

    #toast {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 9999;
      white-space: nowrap;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.exito { border-color: #2ecc71; color: #2ecc71; }
    #toast.error { border-color: #e63946; color: #e63946; }
  </style>
</head>
<body>

<div id="header">
  <div class="logo-circle">MC</div>
  <div>
    <h1>Reporta tu Bache</h1>
    <p>Por Manuel Cantú</p>
  </div>
  <div id="counter-badge">
    <span class="dot-red"></span>
    <span id="total-baches">0</span> baches
  </div>
</div>

<div id="map"></div>

<div id="bottom-bar">
  <button id="btn-gps" onclick="reportarBache()">
    📍 REPORTAR BACHE AQUÍ
  </button>
  <div id="status-msg">Toca el botón para marcar un bache en tu ubicación</div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const API = "TU_URL_DE_RAILWAY_AQUI";

  const map = L.map('map', { zoomControl: false }).setView([23.6345, -102.5528], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  L.control.zoom({ position: 'topright' }).addTo(map);

  const iconoBache = L.divIcon({
    className: '',
    html: '<div style="width:14px;height:14px;background:#e63946;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(230,57,70,0.8);"></div>',
    iconSize: [14, 14],
    iconAnchor: [7, 7]
  });

  function mostrarToast(msg, tipo = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + tipo;
    setTimeout(() => { t.className = ''; }, 3000);
  }

  async function cargarBaches() {
    try {
      const res = await fetch(API + '/baches');
      const baches = await res.json();
      document.getElementById('total-baches').textContent = baches.length;
      baches.forEach(b => {
        L.marker([b.latitud, b.longitud], { icon: iconoBache })
          .addTo(map)
          .bindPopup(`<b>Bache #${b.id}</b><br>${new Date(b.fecha_creacion).toLocaleDateString('es-MX')}`);
      });
    } catch (e) {
      console.error('Error cargando baches', e);
    }
  }

  async function reportarBache() {
    const btn = document.getElementById('btn-gps');
    const status = document.getElementById('status-msg');

    btn.disabled = true;
    status.textContent = 'Obteniendo tu ubicación...';

    if (!navigator.geolocation) {
      mostrarToast('Tu navegador no soporta GPS', 'error');
      btn.disabled = false;
      status.textContent = '';
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude } = pos.coords;
        status.textContent = 'Guardando bache...';

        try {
          const res = await fetch(API + '/baches', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ latitud: latitude, longitud: longitude })
          });

          if (!res.ok) throw new Error();

          const bache = await res.json();

          L.marker([latitude, longitude], { icon: iconoBache })
            .addTo(map)
            .bindPopup(`<b>Bache #${bache.id}</b><br>Recién reportado`)
            .openPopup();

          map.setView([latitude, longitude], 17);

          const total = parseInt(document.getElementById('total-baches').textContent) + 1;
          document.getElementById('total-baches').textContent = total;

          mostrarToast('¡Bache reportado! Gracias 🙌', 'exito');
          status.textContent = 'Toca el botón para marcar un bache en tu ubicación';
        } catch (e) {
          mostrarToast('Error al guardar. Intenta de nuevo.', 'error');
          status.textContent = '';
        }

        btn.disabled = false;
      },
      (err) => {
        mostrarToast('No se pudo obtener tu ubicación', 'error');
        status.textContent = 'Activa el GPS e intenta de nuevo';
        btn.disabled = false;
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  cargarBaches();
</script>
</body>
</html>
