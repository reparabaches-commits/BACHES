<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Baches MX</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Nunito', sans-serif; background: #0f0f0f; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    #header { padding: 10px 16px; background: #111; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #222; flex-shrink: 0; }
    #header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1.5px; color: #fff; }
    #header p { font-size: 11px; color: #666; margin-top: 1px; }
    #counter-badge { margin-left: auto; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #aaa; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: #ff6b35; animation: pulso 1.5s infinite; }
    @keyframes pulso { 0%,100%{opacity:1} 50%{opacity:0.2} }

    #map { flex: 1; width: 100%; }

    #bottom-bar { background: #111; border-top: 1px solid #222; padding: 12px 16px 16px; flex-shrink: 0; }
    .btn-row { display: flex; gap: 10px; margin-bottom: 8px; }

    .btn { flex: 1; padding: 13px 8px; border: none; border-radius: 12px; font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 1px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: transform 0.1s, opacity 0.2s; }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-gps { background: #ff6b35; color: #fff; }
    .btn-manual { background: #1e1e1e; color: #fff; border: 1px solid #333; }
    .btn-manual.activo { background: #ff6b35; border-color: #ff6b35; }

    #status-msg { text-align: center; font-size: 12px; color: #555; min-height: 16px; }

    #toast { position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%) translateY(10px); background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 9999; white-space: nowrap; pointer-events: none; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.exito { border-color: #2ecc71; color: #2ecc71; }
    #toast.error { border-color: #e63946; color: #e63946; }
    #toast.info { border-color: #ff6b35; color: #ff6b35; }

    .leaflet-popup-content-wrapper { background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .leaflet-popup-tip { background: #1a1a1a; }
    .leaflet-popup-content { margin: 14px 16px; }
    .popup-titulo { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; margin-bottom: 4px; }
    .popup-puntos { font-size: 13px; color: #aaa; margin-bottom: 10px; }
    .popup-estado { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; margin-bottom: 10px; }
    .estado-candidato { background: #ff6b3520; color: #ff6b35; border: 1px solid #ff6b3540; }
    .estado-reparacion { background: #e6394620; color: #e63946; border: 1px solid #e6394640; }
    .btn-votar { width: 100%; padding: 10px; background: #ff6b35; color: #fff; border: none; border-radius: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; cursor: pointer; }
    .btn-votar:hover { background: #e55a25; }
  </style>
</head>
<body>

<div id="header">
  <div>
    <h1>🕳️ BACHES MX</h1>
    <p>Reporta y vota para reparar tu calle</p>
  </div>
  <div id="counter-badge">
    <span class="pulse"></span>
    <span id="total-baches">0</span> baches
  </div>
</div>

<div id="map"></div>

<div id="bottom-bar">
  <div class="btn-row">
    <button class="btn btn-gps" onclick="reportarConGPS()">📍 GPS</button>
    <button class="btn btn-manual" id="btn-manual" onclick="toggleModoManual()">🗺️ MANUAL</button>
  </div>
  <div id="status-msg">Usa GPS para marcar donde estás, o Manual para tocar el mapa</div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const API = "https://baches-production.up.railway.app";
  let modoManual = false;
  let marcadores = {};
  let posUsuario = null;

  const map = L.map('map', { zoomControl: false }).setView([23.6345, -102.5528], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);
  L.control.zoom({ position: 'topright' }).addTo(map);

  // Icono según estado
  function iconoBache(estado) {
    const color = estado === 'reparacion' ? '#e63946' : '#ff6b35';
    const glow = estado === 'reparacion' ? 'rgba(230,57,70,0.7)' : 'rgba(255,107,53,0.7)';
    return L.divIcon({
      className: '',
      html: `<div style="width:16px;height:16px;background:${color};border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px ${glow};"></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });
  }

  function mostrarToast(msg, tipo = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + tipo;
    setTimeout(() => { t.className = ''; }, 3000);
  }

  function setStatus(msg) {
    document.getElementById('status-msg').textContent = msg;
  }

  function popupHTML(b) {
    const estadoLabel = b.estado === 'reparacion' ? 'PARA REPARACIÓN' : 'CANDIDATO';
    const estadoClass = b.estado === 'reparacion' ? 'estado-reparacion' : 'estado-candidato';
    return `
      <div class="popup-titulo">BACHE #${b.id}</div>
      <div class="popup-puntos">⚡ ${b.puntos} puntos acumulados</div>
      <div class="popup-estado ${estadoClass}">${estadoLabel}</div><br/>
      <button class="btn-votar" onclick="votarBache(${b.id}, ${b.latitud}, ${b.longitud})">👍 VOTAR POR ARREGLARLO</button>
    `;
  }

  async function cargarBaches() {
    try {
      const res = await fetch(API + '/baches');
      const baches = await res.json();
      document.getElementById('total-baches').textContent = baches.length;
      baches.forEach(b => agregarMarcador(b));
    } catch (e) {
      console.error('Error cargando baches', e);
    }
  }

  function agregarMarcador(b) {
    if (marcadores[b.id]) {
      map.removeLayer(marcadores[b.id]);
    }
    const m = L.marker([b.latitud, b.longitud], { icon: iconoBache(b.estado) })
      .addTo(map)
      .bindPopup(popupHTML(b), { maxWidth: 240 });
    marcadores[b.id] = m;
  }

  async function guardarBache(lat, lng) {
    try {
      const res = await fetch(API + '/baches', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ latitud: lat, longitud: lng })
      });
      if (!res.ok) throw new Error();
      const bache = await res.json();
      agregarMarcador(bache);
      map.setView([lat, lng], 17);
      const total = parseInt(document.getElementById('total-baches').textContent) + 1;
      document.getElementById('total-baches').textContent = total;
      mostrarToast('¡Bache reportado! 🙌', 'exito');
      setStatus('Usa GPS para marcar donde estás, o Manual para tocar el mapa');
    } catch (e) {
      mostrarToast('Error al guardar. Intenta de nuevo.', 'error');
    }
  }

  function reportarConGPS() {
    if (modoManual) toggleModoManual();
    if (!navigator.geolocation) { mostrarToast('Tu navegador no soporta GPS', 'error'); return; }
    setStatus('Obteniendo tu ubicación...');
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        posUsuario = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        setStatus('Guardando bache...');
        await guardarBache(pos.coords.latitude, pos.coords.longitude);
      },
      () => { mostrarToast('No se pudo obtener tu ubicación', 'error'); setStatus('Activa el GPS e intenta de nuevo'); },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  function toggleModoManual() {
    modoManual = !modoManual;
    const btn = document.getElementById('btn-manual');
    if (modoManual) {
      btn.classList.add('activo');
      setStatus('Toca el mapa donde está el bache para marcarlo');
      mostrarToast('Toca el mapa para marcar el bache', 'info');
    } else {
      btn.classList.remove('activo');
      setStatus('Usa GPS para marcar donde estás, o Manual para tocar el mapa');
    }
  }

  map.on('click', async function(e) {
    if (!modoManual) return;
    toggleModoManual();
    setStatus('Guardando bache...');
    await guardarBache(e.latlng.lat, e.latlng.lng);
  });

  async function votarBache(id, latBache, lngBache) {
    // Intentar obtener GPS del usuario para calcular distancia
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          await enviarVoto(id, pos.coords.latitude, pos.coords.longitude);
        },
        async () => {
          // Sin GPS, voto vale 2 puntos
          await enviarVoto(id, null, null);
        },
        { enableHighAccuracy: true, timeout: 5000 }
      );
    } else {
      await enviarVoto(id, null, null);
    }
  }

  async function enviarVoto(id, lat, lng) {
    try {
      const body = { bache_id: id };
      if (lat && lng) { body.latitud_usuario = lat; body.longitud_usuario = lng; }
      const res = await fetch(API + '/votos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      
      // Actualizar marcador en el mapa
      const bacheActualizado = { id: id, latitud: 0, longitud: 0, puntos: data.total_puntos, estado: data.estado };
      // Recargar baches para actualizar
      const res2 = await fetch(API + '/baches');
      const baches = await res2.json();
      const b = baches.find(x => x.id === id);
      if (b) agregarMarcador(b);

      map.closePopup();

      const msg = data.puntos_sumados === 5
        ? `¡Voto registrado! +5 puntos (estabas cerca 📍)` 
        : `¡Voto registrado! +2 puntos`;
      mostrarToast(msg, 'exito');
    } catch (e) {
      mostrarToast('Error al votar. Intenta de nuevo.', 'error');
    }
  }

  // Obtener posición del usuario al cargar para tener referencia
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      posUsuario = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    }, () => {}, { enableHighAccuracy: true });
  }

  cargarBaches();
</script>
</body>
</html>
