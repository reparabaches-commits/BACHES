<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Baches</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Nunito', sans-serif; background: #0f0f0f; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    #header {
      padding: 10px 16px;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }
    #header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; color: #e63946; }
    #badge-total {
      margin-left: auto;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: #ccc;
    }

    #map { flex: 1; width: 100%; z-index: 1; }

    /* Panel config */
    #config-bar {
      background: #111;
      border-top: 1px solid #222;
      padding: 10px 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #config-bar label { font-size: 12px; color: #888; }
    #config-bar select {
      background: #1a1a1a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-family: 'Nunito', sans-serif;
    }
    #btn-guardar-config {
      padding: 7px 14px;
      background: #e63946;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: 1px;
      cursor: pointer;
    }
    #config-status { font-size: 11px; color: #666; margin-left: auto; }

    /* Popup admin */
    .popup-admin { font-family: 'Nunito', sans-serif; min-width: 180px; }
    .popup-admin .votos-line { font-size: 14px; margin-bottom: 8px; text-align: center; }
    .popup-admin .btn-row { display: flex; gap: 6px; }
    .popup-admin button {
      flex: 1;
      padding: 7px 6px;
      border: none;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-completar { background: #2ecc71; color: #fff; }
    .btn-eliminar  { background: #e63946; color: #fff; }
    .btn-completar:disabled, .btn-eliminar:disabled { background: #444; color: #888; cursor: not-allowed; }

    #toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 9999;
      white-space: nowrap;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.exito { border-color: #2ecc71; color: #2ecc71; }
    #toast.error { border-color: #e63946; color: #e63946; }
    #toast.info  { border-color: #f4a261; color: #f4a261; }
  </style>
</head>
<body>

<div id="header">
  <div>
    <h1>⚙️ Panel Admin — Baches</h1>
  </div>
  <div id="badge-total">Cargando...</div>
  <button onclick="centrarUbicacion()" style="margin-left:8px;padding:6px 12px;background:#1a1a1a;border:1px solid #444;color:#ccc;border-radius:20px;font-size:12px;cursor:pointer;">📍 Ubicación</button>
</div>

<div id="map"></div>

<div id="config-bar">
  <label>Votos:</label>
  <select id="sel-votos">
    <option value="0">Sin restricción</option>
    <option value="1">1 min</option>
    <option value="60">1 hora</option>
    <option value="180">3 horas</option>
    <option value="360" selected>6 horas</option>
    <option value="720">12 horas</option>
    <option value="1440">24 horas</option>
  </select>
  <label style="margin-left:8px;">Crear bache:</label>
  <select id="sel-creacion">
    <option value="0">Sin restricción</option>
    <option value="1">1 min</option>
    <option value="60">1 hora</option>
    <option value="360">6 horas</option>
    <option value="720">12 horas</option>
    <option value="1440" selected>24 horas</option>
  </select>
  <label style="margin-left:8px;">Dist. límite (m):</label>
  <input id="inp-distancia" type="number" value="50" min="1" max="500"
    style="width:60px;background:#1a1a1a;border:1px solid #444;color:#fff;border-radius:8px;padding:6px 8px;font-size:13px;"/>
  <label style="margin-left:8px;">Votos cerca:</label>
  <input id="inp-votos-cerca" type="number" value="5" min="1" max="100"
    style="width:50px;background:#1a1a1a;border:1px solid #444;color:#fff;border-radius:8px;padding:6px 8px;font-size:13px;"/>
  <label style="margin-left:8px;">Votos lejos:</label>
  <input id="inp-votos-lejos" type="number" value="2" min="1" max="100"
    style="width:50px;background:#1a1a1a;border:1px solid #444;color:#fff;border-radius:8px;padding:6px 8px;font-size:13px;"/>
  <label style="margin-left:8px;">Umbral urgente:</label>
  <input id="inp-umbral" type="number" value="100" min="1"
    style="width:65px;background:#1a1a1a;border:1px solid #444;color:#fff;border-radius:8px;padding:6px 8px;font-size:13px;"/>
  <button id="btn-guardar-config" onclick="guardarConfig()">GUARDAR</button>
  <span id="config-status"></span>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const API = "https://baches-production.up.railway.app";

  const map = L.map('map', { zoomControl: true }).setView([23.6345, -102.5528], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  }).addTo(map);

  function iconoEstado(estado) {
    if (estado === 'reparado') {
      return L.divIcon({
        className: '',
        html: `<div style="width:22px;height:22px;background:#2ecc71;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(46,204,113,0.8);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;">✓</div>`,
        iconSize: [22,22], iconAnchor: [11,11]
      });
    }
    const colores = {
      reportado: { bg: '#f4a261', sombra: 'rgba(244,162,97,0.7)' },
      urgente:   { bg: '#e63946', sombra: 'rgba(230,57,70,0.8)' },
    };
    const c = colores[estado] || colores.reportado;
    return L.divIcon({
      className: '',
      html: `<div style="width:14px;height:14px;background:${c.bg};border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px ${c.sombra};"></div>`,
      iconSize: [14,14], iconAnchor: [7,7]
    });
  }

  let marcadores = {}; // id -> marker
  let baches = [];

  function mostrarToast(msg, tipo = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + tipo;
    setTimeout(() => { t.className = ''; }, 3000);
  }

  function etiquetaEstado(estado) {
    if (estado === 'reparado') return '<span style="color:#2ecc71;">✅ Reparado</span>';
    if (estado === 'urgente')  return '<span style="color:#e63946;">🔴 Requiere reparación</span>';
    return '<span style="color:#f4a261;">🟠 Reportado</span>';
  }

  function popupAdmin(b) {
    const reparado = b.estado === 'reparado';
    return `
      <div class="popup-admin">
        <div class="votos-line">${etiquetaEstado(b.estado || 'reportado')}</div>
        <div class="votos-line">⚠️ <b>${b.votos || 0}</b> votos · 👥 <b>${b.votantes || 0}</b> personas</div>
        <div class="btn-row">
          <button class="btn-completar" onclick="marcarCompletado(${b.id})" ${reparado ? 'disabled' : ''}>
            ${reparado ? '✅ Reparado' : '✔ Marcar reparado'}
          </button>
          <button class="btn-eliminar" onclick="eliminarBache(${b.id})">🗑 Eliminar</button>
        </div>
      </div>`;
  }

  async function cargarBaches() {
    try {
      const res = await fetch(API + '/baches');
      baches = await res.json();
      if (!Array.isArray(baches)) return;

      document.getElementById('badge-total').textContent =
        `${baches.length} baches · ${baches.reduce((s,b) => s + (b.votos||0), 0)} votos totales`;

      baches.forEach(b => {
        const icono = iconoEstado(b.estado || 'reportado');
        const marker = L.marker([b.latitud, b.longitud], { icon: icono })
          .addTo(map)
          .bindPopup(popupAdmin(b));
        marcadores[b.id] = marker;
      });
    } catch(e) {
      mostrarToast('Error cargando baches', 'error');
    }
  }

  async function eliminarBache(id) {
    if (!confirm('¿Eliminar este bache?')) return;
    try {
      const res = await fetch(`${API}/baches/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error();
      if (marcadores[id]) { map.removeLayer(marcadores[id]); delete marcadores[id]; }
      baches = baches.filter(b => b.id !== id);
      actualizarBadge();
      map.closePopup();
      mostrarToast('Bache eliminado', 'exito');
    } catch(e) {
      mostrarToast('Error al eliminar', 'error');
    }
  }

  async function marcarCompletado(id) {
    try {
      const res = await fetch(`${API}/baches/${id}/completar`, { method: 'POST' });
      if (!res.ok) throw new Error();
      const b = baches.find(b => b.id === id);
      if (b) {
        b.completado = true;
        b.estado = 'reparado';
        marcadores[id].setIcon(iconoEstado('reparado'));
        marcadores[id].setPopupContent(popupAdmin(b));
      }
      map.closePopup();
      mostrarToast('Marcado como completado', 'exito');
    } catch(e) {
      mostrarToast('Error al actualizar', 'error');
    }
  }

  function actualizarBadge() {
    document.getElementById('badge-total').textContent =
      `${baches.length} baches · ${baches.reduce((s,b) => s + (b.votos||0), 0)} votos totales`;
  }

  async function guardarConfig() {
    const votos = parseInt(document.getElementById('sel-votos').value);
    const creacion = parseInt(document.getElementById('sel-creacion').value);
    const distancia = parseInt(document.getElementById('inp-distancia').value);
    const votosCerca = parseInt(document.getElementById('inp-votos-cerca').value);
    const votosLejos = parseInt(document.getElementById('inp-votos-lejos').value);
    try {
      const res = await fetch(API + '/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ restriccion_votos: votos, restriccion_creacion: creacion, distancia_limite: distancia, votos_cerca: votosCerca, votos_lejos: votosLejos, votos_umbral: parseInt(document.getElementById('inp-umbral').value) })
      });
      if (!res.ok) throw new Error();
      document.getElementById('config-status').textContent = '✓ Guardado';
      mostrarToast('Configuración guardada', 'exito');
      setTimeout(() => { document.getElementById('config-status').textContent = ''; }, 3000);
    } catch(e) {
      mostrarToast('Error al guardar', 'error');
    }
  }

  async function cargarConfig() {
    try {
      const res = await fetch(API + '/config');
      const data = await res.json();
      if (data.restriccion_votos) document.getElementById('sel-votos').value = data.restriccion_votos;
      if (data.restriccion_creacion) document.getElementById('sel-creacion').value = data.restriccion_creacion;
      if (data.distancia_limite) document.getElementById('inp-distancia').value = data.distancia_limite;
      if (data.votos_cerca) document.getElementById('inp-votos-cerca').value = data.votos_cerca;
      if (data.votos_lejos) document.getElementById('inp-votos-lejos').value = data.votos_lejos;
      if (data.votos_umbral) document.getElementById('inp-umbral').value = data.votos_umbral;
    } catch(e) {}
  }

  function centrarUbicacion() {
    if (!navigator.geolocation) { mostrarToast('GPS no disponible', 'error'); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { map.setView([pos.coords.latitude, pos.coords.longitude], 17); },
      () => { mostrarToast('No se pudo obtener la ubicación', 'error'); },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  cargarConfig();
  cargarBaches();
</script>
</body>
</html>
